services:
  birthday-bot:
    build: .
    image: birthday-bot:latest
    container_name: birthday-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - KLIPY_API_KEY=${KLIPY_API_KEY}
      - TIMEZONE=${TIMEZONE:-America/Lima}
      - CHECK_HOUR=${CHECK_HOUR:-8}
      - MENTION_EVERYONE=${MENTION_EVERYONE:-true}
      - DATA_FILE=/data/birthdays.json
      - SYNC_COMMANDS=${SYNC_COMMANDS:-0}
    volumes:
      - birthday_data:/data

volumes:
  birthday_data: